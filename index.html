<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>쫌쫌따리 - 한방에 보내줄게</title>
<meta name="description" content="한방에 보내줄게. 설치 없이 바로 플레이.">
<meta property="og:type" content="website">
<meta property="og:title" content="쫌쫌따리">
<meta property="og:description" content="한방에 보내줄게. 설치 없이 바로 플레이.">
<meta property="og:url" content="https://xn--v01b28fz9ra.com/">
<meta property="og:image" content="https://xn--v01b28fz9ra.com/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{--bg:#15171f;--map:#2b2b31;--pill:#3b4a7a;--ink:#e6e9ff;--dim:#8a93c4;--accent:#8fa3ff;--play:#ffd34d;--line:#111}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:'Jua','Malgun Gothic',sans-serif;color:var(--ink)}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair;touch-action:none}
.overlay{position:fixed;inset:0;background:rgba(21,23,31,.72);display:none;justify-content:center;align-items:flex-start;overflow:auto;z-index:10}
.overlay.show{display:flex}
.box{max-width:980px;width:100%;padding:28px 16px;text-align:center}
h1{font-size:54px;margin:4px 0 0;letter-spacing:2px;font-weight:normal;text-shadow:0 4px 30px rgba(0,0,0,.8)}
h2{margin:6px 0 12px;font-weight:normal;font-size:26px}
.sub{color:var(--dim);margin-bottom:14px}
button{font-family:inherit;font-size:16px;padding:10px 22px;border:2px solid var(--line);background:var(--pill);color:var(--ink);border-radius:30px;cursor:pointer;margin:4px;box-shadow:0 6px 30px rgba(0,0,0,.7);opacity:.85;transition:opacity .1s}
button:hover{opacity:1}
button:active{opacity:.5}
button.sm{font-size:13px;padding:5px 12px;margin:2px;box-shadow:0 3px 14px rgba(0,0,0,.6)}
button.on{background:var(--accent);color:#111}
button.warn{color:#ff8a8a}
button:disabled{opacity:.3;cursor:default}
button.play{font-size:30px;padding:12px 70px;background:var(--play);color:#111;border-radius:40px;box-shadow:0 6px 40px rgba(0,0,0,.8),0 0 40px rgba(255,211,77,.35);margin-top:18px}
button.link{background:none;border:none;box-shadow:none;color:var(--dim);font-size:15px;padding:6px 10px}
button.link:hover{color:var(--ink)}
input[type=text]{font-family:inherit;font-size:18px;padding:10px 18px;border:2px solid var(--line);border-radius:30px;text-align:center;width:260px;margin:10px 0;background:var(--pill);color:var(--ink);box-shadow:0 6px 40px rgba(0,0,0,.8);outline:none}
input[type=text]::placeholder{color:var(--dim)}
#menuChar{width:150px;margin:0 0 4px;filter:drop-shadow(0 8px 30px rgba(0,0,0,.8))}
#introCv{width:min(720px,94vw);height:auto;display:block;margin:-6px auto 0;cursor:pointer}
#lastLine{min-height:22px;color:var(--ink);font-size:16px;margin-top:6px}
#tip{min-height:20px;color:var(--dim);font-size:14px;margin:6px 0 2px;transition:opacity .4s}
#menuWeapon{position:fixed;left:18px;bottom:18px;z-index:11;cursor:pointer;opacity:.85;text-align:center;font-size:13px;color:var(--dim)}
#menuWeapon canvas{width:84px;height:84px;display:block;margin:0 auto 2px;background:rgba(255,255,255,.06);border:2px solid var(--line);border-radius:18px;box-shadow:0 6px 30px rgba(0,0,0,.7)}
#menuWeapon:hover{opacity:1}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin:14px 0}
.card{border:2px solid var(--line);border-radius:18px;padding:8px;background:rgba(59,74,122,.45);box-shadow:0 6px 30px rgba(0,0,0,.6)}
.card canvas{width:120px;height:120px;display:block;margin:0 auto;background:rgba(255,255,255,.06);border-radius:12px}
.card .tag{font-size:12px;color:#ff8a8a;min-height:16px}
.card .nm{font-size:13px;color:var(--dim)}
.card .st{font-size:12px;margin:2px 0 4px;color:var(--ink)}
.tools{margin:6px 0}
.pal{display:inline-block;width:26px;height:26px;border-radius:50%;border:3px solid transparent;margin:2px;cursor:pointer;vertical-align:middle;box-shadow:0 2px 8px rgba(0,0,0,.6)}
.pal.on{border-color:var(--ink)}
#edWrap{position:relative;width:min(420px,90vw);aspect-ratio:1;margin:10px auto;border:2px solid var(--line);border-radius:18px;background:#fff;overflow:hidden;touch-action:none;box-shadow:0 10px 50px rgba(0,0,0,.8)}
#edWrap canvas{position:absolute;inset:0;width:100%;height:100%}
#edReadout{font-size:15px;min-height:22px;margin:6px 0}
.hint{font-size:13px;color:var(--dim)}
#proto{position:fixed;left:10px;bottom:8px;font-size:12px;color:#555;z-index:5;pointer-events:none}
textarea{background:var(--pill)!important;color:var(--ink)!important;border:2px solid var(--line)!important;border-radius:18px!important}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="proto">쫌쫌따리 · 온라인</div>

<!-- 시작 화면 -->
<div class="overlay show" id="menu"><div class="box">
  <img id="menuChar" alt="">
  <canvas id="introCv" width="720" height="170" title="다시 보기"></canvas>
  <div id="lastLine">&nbsp;</div>
  <div id="tip">&nbsp;</div>
  <div><input type="text" id="nick" maxlength="12" placeholder="닉네임"></div>
  <div><button class="play" id="btnPlay">플레이</button></div>
  <div>
    <button class="link" id="btnDraw">✏️ 무기 그리기</button>
    <button class="link" id="btnPick">📂 남이 그린 무기</button>
  </div>
</div></div>
<div id="menuWeapon" title="지금 든 무기"><canvas id="menuWeaponCv" width="84" height="84"></canvas><div id="menuWeaponName">기본 무기</div></div>

<!-- 그림판 -->
<div class="overlay" id="editor"><div class="box">
  <h2>무기 그리기</h2>
  <div class="tools" id="toolBtns">
    <button class="sm on" data-tool="brush">붓</button>
    <button class="sm" data-tool="eraser">지우개</button>
    <button class="sm" data-tool="fill">페인트통</button>
    <button class="sm" data-tool="picker">스포이드</button>
    <button class="sm" data-tool="hand">✋ 손 위치</button>
    &nbsp;
    <button class="sm" id="btnUndo">↶ 되돌리기</button>
    <button class="sm" id="btnRedo">↷ 다시하기</button>
    <button class="sm warn" id="btnClear">전부 지우기</button>
  </div>
  <div class="tools">
    굵기 <input type="range" id="bsize" min="2" max="40" value="6" style="vertical-align:middle">
    <span id="bsizeTxt">6</span>
    &nbsp; <span id="palette"></span>
    <input type="color" id="colorIn" value="#111111" style="vertical-align:middle;width:36px;height:30px;border:none;background:none">
  </div>
  <div id="edWrap"><canvas id="edCv" width="256" height="256"></canvas><canvas id="edOv" width="256" height="256"></canvas></div>
  <div id="edReadout"></div>
  <div class="hint">많이 칠할수록 넓게 쓸지만 느려지고, 길수록 멀리 닿습니다. 손 위치는 보이는 모습만 바꿉니다.</div>
  <div style="margin-top:8px">
    <button id="btnEdDone">⚔️ 이 무기로 시작</button>
    <button id="btnEdBack">뒤로</button>
  </div>
</div></div>

<!-- 남이 그린 무기 목록 -->
<div class="overlay" id="picker"><div class="box">
  <h2>남이 그린 무기</h2>
  <div>
    <button class="sm on" id="sortNew">최근 것</button>
    <button class="sm" id="sortUsed">많이 쓰인 것</button>
  </div>
  <div class="hint">시험판에서는 이 기기에서 그린 무기와 기본 무기만 보입니다. 신고하면 이 기기에서 바로 숨겨집니다.</div>
  <div class="cards" id="pickCards"></div>
  <button id="btnPickBack">뒤로</button>
</div></div>

<!-- 결과 화면 -->
<div class="overlay" id="result"><div class="box">
  <h2 id="resTitle">쓰러졌다!</h2>
  <div id="resStats" class="sub"></div>
  <div><b>이번 판에서 본 무기</b></div>
  <div class="cards" id="resCards"></div>
  <div>
    <button id="btnResMine">🔁 내 무기로 다시 시작</button>
    <button id="btnResDraw">✏️ 새로 그리기</button>
    <button id="btnResPick">📂 목록에서 고르기</button>
  </div>
  <div style="margin-top:6px"><button class="link" id="btnShare">🔗 친구한테 보내기</button> <span id="shareMsg" class="hint"></span></div>
  <div id="fbBox" style="display:none;margin-top:18px;border-top:2px dashed #ccc;padding-top:12px">
    <div><b>개발자에게 한마디</b> <span class="hint">(버그, 요청, 아무 말이나)</span></div>
    <textarea id="fbText" maxlength="300" rows="3" placeholder="예) 망치가 너무 세요 / 색 더 많았으면" style="width:min(520px,90vw);font-family:inherit;font-size:14px;padding:8px;border:3px solid #111;border-radius:12px;margin:6px 0;resize:vertical"></textarea>
    <div><button class="sm" id="fbSend">보내기</button> <span id="fbMsg" class="hint"></span></div>
  </div>
</div></div>

<script src="config.js"></script>

const backOut = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
function drawIntro() {
  if (!titleCv) titleCv = makeTitle();
  const W = introCv.width, H = introCv.height, t = (performance.now() - introT0) / 1000;
  const cx = W / 2, cy = H * 0.55, SL = -0.22;          // 베는 선: 비스듬히 (오른쪽이 위로)
  const lineY = x => cy + (x - cx) * SL;

  ix.clearRect(0, 0, W, H);

  if (t >= HIT) {
    const k = Math.min(1, (t - HIT) / 0.55), gap = 26 * (1 - backOut(k));
    const half = (top) => {
      ix.save(); ix.beginPath();
      if (top) { ix.moveTo(-50, lineY(-50)); ix.lineTo(W + 50, lineY(W + 50)); ix.lineTo(W + 50, -50); ix.lineTo(-50, -50); }
      else { ix.moveTo(-50, lineY(-50)); ix.lineTo(W + 50, lineY(W + 50)); ix.lineTo(W + 50, H + 50); ix.lineTo(-50, H + 50); }
      ix.closePath(); ix.clip();
      const dx = gap * 0.9, dy = gap * 0.45;
      ix.drawImage(titleCv, top ? -dx : dx, top ? -dy : dy);
      ix.restore();
    };
    half(true); half(false);
    // 베인 자국: 흰 선이 번쩍였다 사라짐
    if (t < HIT + 0.22) {

      ix.beginPath(); ix.moveTo(cx - 230, lineY(cx - 230)); ix.lineTo(cx + 230, lineY(cx + 230)); ix.stroke();
      ix.shadowBlur = 0; ix.globalAlpha = 1;
    }
  }
  // 베기: 두껍고 밝은 초승달 궤적이 왼쪽 위에서 오른쪽 아래로 (게임 속 휘두르기 효과와 같은 모양)

    const fade = t < HIT ? 1 : 1 - (t - HIT) / 0.18;
    const ax = -140, ay = -30, bx = W + 140, by = H + 30;                       // 궤적이 지나는 대각선
    const P = u => [ax + (bx - ax) * u, ay + (by - ay) * u - Math.sin(u * Math.PI) * 70]; // 살짝 휜 호
    const N = 18; ix.globalAlpha = fade;
    ix.beginPath();
    for (let i = 0; i <= N; i++) { const u = tail + (head - tail) * i / N, [x, y] = P(u); const w = 34 * Math.sin(i / N * Math.PI * 0.9); i ? ix.lineTo(x, y - w) : ix.moveTo(x, y - w); }
    for (let i = N; i >= 0; i--) { const u = tail + (head - tail) * i / N, [x, y] = P(u); const w = 34 * Math.sin(i / N * Math.PI * 0.9); ix.lineTo(x, y + w * 0.35); }
    ix.closePath();
    const [gx0, gy0] = P(tail), [gx1, gy1] = P(head);
    const g = ix.createLinearGradient(gx0, gy0, gx1, gy1); g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.6, 'rgba(255,255,255,.55)'); g.addColorStop(1, 'rgba(255,255,255,.95)');
    ix.fillStyle = g; ix.shadowColor = 'rgba(255,255,255,.8)'; ix.shadowBlur = 18; ix.fill(); ix.shadowBlur = 0;
    ix.strokeStyle = 'rgba(255,255,255,.9)'; ix.lineWidth = 2; ix.lineCap = 'round';
    for (const off of [-14, 10]) { ix.beginPath(); for (let i = 0; i <= N; i++) { const u = tail + 0.1 + (head - tail - 0.15) * i / N, [x, y] = P(u); i ? ix.lineTo(x, y + off) : ix.moveTo(x, y + off); } ix.stroke(); }

const ED = 256, edCv = $('edCv'), edX = edCv.getContext('2d', { willReadFrequently: true }), edO = $('edOv'), edOX = edO.getContext('2d');

function flood(x, y) {
