<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>쫌쫌따리 트래픽</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#141417;color:#eee;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;padding:20px 22px 40px}
h1{margin:0;font-size:22px}
h2{font-size:15px;margin:0 0 10px;color:#aaa;font-weight:normal}
.card{background:#1f1f24;border-radius:14px;padding:16px 18px}
#login{max-width:360px;margin:60px auto}
input,button,select{font-family:inherit;font-size:15px}
input{width:100%;padding:10px;border:2px solid #444;border-radius:10px;background:#111;color:#eee;margin:6px 0}
button{padding:8px 16px;border:2px solid #eee;border-radius:12px;background:#eee;color:#111;cursor:pointer;margin:4px 2px}
button.ghost{background:none;color:#eee}
button.danger{border-color:#ff6b6b;color:#ff6b6b;background:none;padding:3px 9px;font-size:12px}
select{background:#1f1f24;color:#eee;border:2px solid #444;border-radius:10px;padding:7px 10px}
#top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:#1f1f24;border-radius:14px;padding:14px 16px}
.kpi .n{font-size:32px;font-weight:bold;line-height:1.1}
.kpi .l{font-size:13px;color:#999;margin-top:4px}
.kpi .d{font-size:12px;color:#8fd3ff;margin-top:2px}
.grid{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-bottom:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:14px}
@media(max-width:900px){.grid,.grid3{grid-template-columns:1fr}}
.bars{display:flex;align-items:flex-end;gap:4px;height:160px;margin-top:8px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.bars .b i{display:block;width:100%;background:#8fd3ff;border-radius:4px 4px 0 0;min-height:2px}
.bars .b i.v2{background:#3b4a7a}
.bars .b .v{font-size:11px;color:#ccc;margin-bottom:3px}
.bars .b .x{font-size:10px;color:#888;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.legend{font-size:12px;color:#999;margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:middle;margin:0 4px 0 8px}
.hbar{display:grid;grid-template-columns:110px 1fr 44px;gap:8px;align-items:center;font-size:13px;padding:4px 0}
.hbar .t{display:block;height:12px;background:#333;border-radius:6px;overflow:hidden}
.hbar .t i{display:block;height:100%;background:#8fd3ff}
.hbar .r{text-align:right;color:#ccc}
.hbar .k{color:#ddd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fb{background:#26262c;border-radius:12px;padding:10px 12px;margin:8px 0}
.fb .meta{font-size:12px;color:#999;margin-bottom:4px}
.fb .msg{white-space:pre-wrap;word-break:break-word}
.hint{color:#888;font-size:13px}
#err{color:#ff6b6b;min-height:20px}
.split{display:flex;height:22px;border-radius:11px;overflow:hidden;margin:10px 0 6px;font-size:12px}
.split div{display:flex;align-items:center;justify-content:center;color:#111;font-weight:bold;min-width:0}
</style>
</head>
<body>
<div id="login" class="card">
  <h1>쫌쫌따리 트래픽</h1>
  <input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password">
  <button id="btnLogin">로그인</button>
  <div id="err"></div>
</div>

<div id="dash" style="display:none">
  <div id="top">
    <h1>쫌쫌따리 트래픽</h1>
    <div>
      <select id="range"><option value="1">오늘</option><option value="7" selected>최근 7일</option><option value="14">최근 14일</option><option value="30">최근 30일</option><option value="90">최근 90일</option></select>
      <label class="hint" style="margin-left:8px"><input type="checkbox" id="exMe" checked style="width:auto;margin:0 4px 0 0;vertical-align:middle">내 테스트 접속 빼기</label>
      <button class="ghost" id="btnReload">새로고침</button>
      <button class="ghost" id="btnLogout">로그아웃</button>
    </div>
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="grid">
    <div class="card"><h2>날짜별 방문자</h2><div class="bars" id="daily"></div><div class="legend"><i style="background:#8fd3ff"></i>방문자(기기 수)<i style="background:#3b4a7a"></i>그중 신규</div></div>
    <div class="card"><h2>PC · 모바일</h2><div class="split" id="split"></div><div id="device"></div></div>
  </div>

  <div class="grid3">
    <div class="card"><h2>시간대별 방문 (0시~23시)</h2><div class="bars" id="hourly" style="height:120px"></div></div>
    <div class="card"><h2>어디서 들어왔나</h2><div id="ref"></div></div>
    <div class="card"><h2>들어와서 뭘 했나</h2><div id="funnel"></div></div>
  </div>

  <div class="card"><h2>💬 개발자에게 한마디 <span class="hint" id="fbCount"></span></h2><div id="fbList"></div></div>
</div>

<script src="../config.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const API = ((window.JJ_CONFIG || {}).api || '/api');
let rows = [];
const api = (path, opt) => fetch(API + path, Object.assign({ credentials: 'same-origin', headers: { 'Content-Type': 'application/json' } }, opt || {}));
let myVid = ''; try { myVid = localStorage.getItem('jj_vid') || ''; } catch (e) {}

$('btnLogin').onclick = async () => {
  $('err').textContent = '';
  const r = await api('/admin/login', { method: 'POST', body: JSON.stringify({ password: $('pw').value }) });
  if (r.status === 429) { $('err').textContent = '너무 많이 시도했습니다. 1분 뒤 다시.'; return; }
  if (!r.ok) { $('err').textContent = '비밀번호가 틀렸습니다.'; return; }
  $('pw').value = ''; await load();
};
$('pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('btnLogin').click(); });
$('btnLogout').onclick = async () => { await api('/admin/logout', { method: 'POST' }); location.reload(); };
$('btnReload').onclick = load;
$('range').onchange = render; $('exMe').onchange = render;

async function load() {
  rows = [];
  for (let off = 0; off < 100000; off += 1000) {
    const r = await api(`/admin/events?limit=1000&offset=${off}`);
    if (r.status === 401) { $('login').style.display = ''; $('dash').style.display = 'none'; return; }
    if (!r.ok) { $('err').textContent = '불러오기 실패'; return; }
    const data = await r.json(); rows.push(...data); if (data.length < 1000) break;
  }
  $('login').style.display = 'none'; $('dash').style.display = '';
  render();
}

const DAYS = ['일', '월', '화', '수', '목', '금', '토'];
const dayKey = d => { const t = new Date(d); return `${t.getMonth() + 1}/${t.getDate()}`; };
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;
const pct = (a, b) => b ? Math.round(100 * a / b) + '%' : '-';
const fmt = d => new Date(d).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
const vids = v => new Set(v.map(r => r.vid).filter(Boolean));
function hbars(el, pairs, total) {
  const max = Math.max(1, ...pairs.map(p => p[1]));
  el.innerHTML = pairs.length ? pairs.map(([k, n]) => `<div class="hbar"><span class="k" title="${esc(k)}">${esc(k)}</span><span class="t"><i style="width:${Math.round(100 * n / max)}%"></i></span><span class="r">${n}${total ? ` <span class="hint">${pct(n, total)}</span>` : ''}</span></div>`).join('') : '<p class="hint">아직 없음</p>';
}

function render() {
  const days = +$('range').value, exMe = $('exMe').checked;
  const since = new Date(); since.setHours(0, 0, 0, 0); since.setDate(since.getDate() - (days - 1));
  const all = rows.filter(r => !(exMe && myVid && r.vid === myVid) && r.vid !== 'server');
  const inR = all.filter(r => new Date(r.created_at) >= since);
  const visits = inR.filter(r => r.type === 'visit'), leaves = inR.filter(r => r.type === 'leave'), starts = inR.filter(r => r.type === 'start');
  const fbs = all.filter(r => r.type === 'feedback');
  const uv = vids(visits), newV = vids(visits.filter(r => r.data.first)), startedV = vids(starts);
  const stay = leaves.map(l => l.data.seconds || 0).filter(x => x > 0 && x < 7200);
  const mobile = visits.filter(v => v.data.device === 'mobile').length;
  // 이전 같은 기간과 비교
  const prevSince = new Date(since); prevSince.setDate(prevSince.getDate() - days);
  const prevUv = vids(all.filter(r => r.type === 'visit' && new Date(r.created_at) >= prevSince && new Date(r.created_at) < since)).size;
  const diff = prevUv ? ` 지난 기간 ${prevUv}명 (${uv.size >= prevUv ? '+' : ''}${uv.size - prevUv})` : '';
  $('kpis').innerHTML = [
    ['방문자', uv.size, diff], ['방문 수', visits.length, uv.size ? `1명당 ${(visits.length / uv.size).toFixed(1)}번` : ''],
    ['신규 방문자', newV.size, pct(newV.size, uv.size) + ' 가 처음'], ['재방문자', uv.size - newV.size, ''],
    ['평균 머문 시간', stay.length ? Math.round(avg(stay)) + '초' : '-', stay.length ? `${stay.length}명 기준` : ''],
    ['게임 시작한 방문자', pct(startedV.size, uv.size), `${startedV.size}명 · 총 ${starts.length}판`],
    ['모바일', pct(mobile, visits.length), `${mobile}번 방문`],
  ].map(([l, n, d]) => `<div class="kpi"><div class="n">${n}</div><div class="l">${l}</div><div class="d">${d}</div></div>`).join('');

  // 날짜별 방문자 막대 (왼쪽 → 오른쪽 = 과거 → 오늘)
  const dm = new Map(); for (let i = 0; i < days; i++) { const d = new Date(since); d.setDate(d.getDate() + i); dm.set(dayKey(d), { d, v: new Set(), n: new Set() }); }
  for (const v of visits) { const o = dm.get(dayKey(v.created_at)); if (!o || !v.vid) continue; o.v.add(v.vid); if (v.data.first) o.n.add(v.vid); }
  const dayList = [...dm.values()], dmax = Math.max(1, ...dayList.map(o => o.v.size));
  const showEvery = days > 14 ? Math.ceil(days / 14) : 1;
  $('daily').innerHTML = dayList.map((o, i) => `<div class="b"><span class="v">${o.v.size || ''}</span><i style="height:${Math.round(85 * o.v.size / dmax)}%"></i><i class="v2" style="height:${Math.round(85 * o.n.size / dmax)}%;margin-top:-${Math.round(85 * o.n.size / dmax)}%"></i><span class="x">${i % showEvery === 0 || i === dayList.length - 1 ? `${o.d.getMonth() + 1}/${o.d.getDate()}(${DAYS[o.d.getDay()]})` : ''}</span></div>`).join('');

  // PC·모바일
  const pcN = visits.length - mobile;
  $('split').innerHTML = visits.length ? `<div style="background:#8fd3ff;width:${100 * pcN / visits.length}%">PC ${pct(pcN, visits.length)}</div><div style="background:#ffd34d;width:${100 * mobile / visits.length}%">모바일 ${pct(mobile, visits.length)}</div>` : '';
  const scr = {}; for (const v of visits) { const k = `${v.data.device === 'mobile' ? '모바일' : 'PC'} ${v.data.w && v.data.h ? v.data.w + '×' + v.data.h : ''}`.trim(); scr[k] = (scr[k] || 0) + 1; }
  hbars($('device'), Object.entries(scr).sort((a, b) => b[1] - a[1]).slice(0, 6), visits.length);

  // 시간대
  const hours = new Array(24).fill(0); for (const v of visits) hours[new Date(v.created_at).getHours()]++;
  const hmax = Math.max(1, ...hours);
  $('hourly').innerHTML = hours.map((n, h) => `<div class="b"><span class="v">${n || ''}</span><i style="height:${Math.round(85 * n / hmax)}%"></i><span class="x">${h % 3 === 0 ? h : ''}</span></div>`).join('');

  // 유입 경로
  const refMap = {}; for (const v of visits) { const k = v.data.ref || '직접 입력 · 즐겨찾기 · 메신저'; refMap[k] = (refMap[k] || 0) + 1; }
  hbars($('ref'), Object.entries(refMap).sort((a, b) => b[1] - a[1]).slice(0, 8), visits.length);

  // 전환
  const fbV = vids(inR.filter(r => r.type === 'feedback'));
  const replay = vids(starts.filter(s => true)); // 시작한 사람
  const multi = [...startedV].filter(v => starts.filter(s => s.vid === v).length >= 2).length;
  hbars($('funnel'), [['들어옴', uv.size], ['게임 시작', startedV.size], ['두 판 이상', multi], ['한마디 남김', fbV.size]], uv.size);

  // 한마디
  $('fbCount').textContent = `(${fbs.length}개, 전체 기간)`;
  $('fbList').innerHTML = fbs.length ? fbs.map(f => `<div class="fb"><div class="meta">${fmt(f.created_at)} · ${esc(f.nick) || '익명'} <button class="danger" data-del="${f.id}">삭제</button></div><div class="msg">${esc(f.data.message)}</div></div>`).join('') : '<p class="hint">아직 온 한마디가 없습니다.</p>';
  $('fbList').querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    if (!confirm('이 한마디를 지울까요?')) return;
    const r = await api('/admin/events/' + b.dataset.del, { method: 'DELETE' });
    if (!r.ok) alert('삭제 실패'); else { rows = rows.filter(x => String(x.id) !== b.dataset.del); render(); }
  });
}
api('/admin/me').then(r => { if (r.ok) load(); });
</script>
</body>
</html>
