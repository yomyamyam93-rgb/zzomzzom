<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>쫌쫌따리 관리</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#141417;color:#eee;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;padding:20px}
h1{margin:0 0 16px;font-size:24px}
h2{font-size:17px;margin:26px 0 10px;border-bottom:2px solid #333;padding-bottom:6px}
.card{background:#1f1f24;border-radius:14px;padding:14px 16px}
#login{max-width:360px;margin:60px auto}
input,button,select{font-family:inherit;font-size:15px}
input{width:100%;padding:10px;border:2px solid #444;border-radius:10px;background:#111;color:#eee;margin:6px 0}
button{padding:9px 16px;border:2px solid #eee;border-radius:12px;background:#eee;color:#111;cursor:pointer;margin:4px 2px}
button.ghost{background:none;color:#eee}
button.danger{border-color:#ff6b6b;color:#ff6b6b;background:none;padding:3px 9px;font-size:12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:#1f1f24;border-radius:14px;padding:12px}
.tile .n{font-size:28px;font-weight:bold}
.tile .l{font-size:12px;color:#999}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 8px;border-bottom:1px solid #2c2c33;text-align:left;vertical-align:top}
th{color:#aaa;font-weight:normal}
.fb{background:#1f1f24;border-radius:12px;padding:10px 12px;margin:8px 0}
.fb .meta{font-size:12px;color:#999;margin-bottom:4px}
.fb .msg{white-space:pre-wrap;word-break:break-word}
.bar{height:10px;background:#333;border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:#8fd3ff}
img.w{height:32px;image-rendering:pixelated;background:#fff;border-radius:6px;vertical-align:middle;margin-right:6px}
.hint{color:#888;font-size:13px}
#top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
#err{color:#ff6b6b;min-height:20px}
h3.sub{font-size:14px;color:#bbb;margin:6px 0}
</style>
</head>
<body>
<div id="login" class="card">
  <h1>쫌쫌따리 관리</h1>
  <input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password">
  <button id="btnLogin">로그인</button>
  <div id="err"></div>
</div>

<div id="dash" style="display:none">
  <div id="top">
    <h1>쫌쫌따리 관리</h1>
    <div>
      <select id="range"><option value="1">오늘</option><option value="7" selected>최근 7일</option><option value="30">최근 30일</option><option value="3650">전체</option></select>
      <button class="ghost" id="btnReload">새로고침</button>
      <button class="ghost" id="btnLogout">로그아웃</button>
    </div>
  </div>
  <h2>🚦 트래픽</h2>
  <div class="tiles" id="traffic"></div>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:12px">
    <div><h3 class="sub">날짜별 방문자</h3><table id="tDaily"></table></div>
    <div><h3 class="sub">유입 경로</h3><table id="tRef"></table></div>
    <div><h3 class="sub">기기</h3><table id="tDevice"></table></div>
    <div><h3 class="sub">시간대별 방문</h3><table id="tHour"></table></div>
  </div>

  <h2>🎮 게임</h2>
  <div class="tiles" id="tiles"></div>

  <h2>💬 개발자에게 한마디 <span class="hint" id="fbCount"></span></h2>
  <div id="fbList"></div>

  <h2>📅 날짜별</h2>
  <table id="daily"></table>

  <h2>⚔️ 많이 쓴 무기</h2>
  <table id="weapons"></table>

  <h2>💀 나를 쓰러뜨린 상대 (컴퓨터 이름 기준)</h2>
  <table id="killers"></table>

  <h2>🧾 최근 판 기록</h2>
  <table id="runs"></table>
</div>

<script src="../config.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const API = ((window.JJ_CONFIG || {}).api || '/api');
let rows = [];
const api = (path, opt) => fetch(API + path, Object.assign({ credentials: 'same-origin', headers: { 'Content-Type': 'application/json' } }, opt || {}));

$('btnLogin').onclick = async () => {
  $('err').textContent = '';
  const r = await api('/admin/login', { method: 'POST', body: JSON.stringify({ password: $('pw').value }) });
  if (r.status === 429) { $('err').textContent = '너무 많이 시도했습니다. 1분 뒤 다시.'; return; }
  if (!r.ok) { $('err').textContent = '비밀번호가 틀렸습니다.'; return; }
  $('pw').value = ''; await load();
};
$('pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('btnLogin').click(); });
$('btnLogout').onclick = async () => { await api('/admin/logout', { method: 'POST' }); location.reload(); };
$('btnReload').onclick = load;
$('range').onchange = render;

async function load() {
  rows = [];
  for (let off = 0; off < 50000; off += 1000) {
    const r = await api(`/admin/events?limit=1000&offset=${off}`);
    if (r.status === 401) { $('login').style.display = ''; $('dash').style.display = 'none'; return; }
    if (!r.ok) { $('err').textContent = '불러오기 실패'; return; }
    const data = await r.json(); rows.push(...data); if (data.length < 1000) break;
  }
  $('login').style.display = 'none'; $('dash').style.display = '';
  render();
}

const fmt = d => new Date(d).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
const dayKey = d => { const t = new Date(d); return `${t.getMonth() + 1}/${t.getDate()}`; };
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;
function tableHtml(head, body) { return `<tr>${head.map(h => `<th>${h}</th>`).join('')}</tr>` + body.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join(''); }

function render() {
  const days = +$('range').value, since = Date.now() - days * 86400000;
  const inR = rows.filter(r => new Date(r.created_at).getTime() >= since);
  const visits = inR.filter(r => r.type === 'visit'), starts = inR.filter(r => r.type === 'start');
  const deaths = inR.filter(r => r.type === 'death'), fbs = rows.filter(r => r.type === 'feedback');
  const uniq = new Set(visits.map(r => r.vid).filter(Boolean)).size;
  // ---- 트래픽 ----
  const leaves = inR.filter(r => r.type === 'leave');
  const vids = v => new Set(v.map(r => r.vid).filter(Boolean));
  const uv = vids(visits), newV = vids(visits.filter(r => r.data.first)), startedV = vids(starts), fbV = vids(inR.filter(r => r.type === 'feedback'));
  const stay = leaves.map(l => l.data.seconds || 0).filter(x => x > 0 && x < 7200);
  const pct = (a, b) => b ? Math.round(100 * a / b) + '%' : '-';
  $('traffic').innerHTML = [
    ['방문 수', visits.length], ['방문자', uv.size], ['신규 방문자', newV.size], ['재방문자', uv.size - newV.size],
    ['평균 머문 시간', stay.length ? Math.round(avg(stay)) + '초' : '-'],
    ['방문 → 게임 시작', pct(startedV.size, uv.size)], ['방문 → 한마디', pct(fbV.size, uv.size)],
    ['모바일 비율', pct(visits.filter(v => v.data.device === 'mobile').length, visits.length)],
  ].map(([l, n]) => `<div class="tile"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('');
  const tdMap = {};
  for (const v of visits) { const k = dayKey(v.created_at); const o = tdMap[k] = tdMap[k] || { v: new Set(), n: new Set(), c: 0 }; o.c++; if (v.vid) o.v.add(v.vid); if (v.data.first && v.vid) o.n.add(v.vid); }
  $('tDaily').innerHTML = tableHtml(['날짜', '방문', '방문자', '신규'], Object.keys(tdMap).slice(0, 31).map(k => [k, tdMap[k].c, tdMap[k].v.size, tdMap[k].n.size]));
  const refMap = {};
  for (const v of visits) { const k = v.data.ref || '(직접 입력·즐겨찾기)'; refMap[k] = (refMap[k] || 0) + 1; }
  $('tRef').innerHTML = tableHtml(['어디서', '방문'], Object.entries(refMap).sort((a, b) => b[1] - a[1]).slice(0, 15).map(([k, n]) => [esc(k), n]));
  const devMap = {};
  for (const v of visits) { const k = `${v.data.device === 'mobile' ? '모바일' : 'PC'} · ${v.data.w || '?'}×${v.data.h || '?'} · ${v.data.lang || ''}`; devMap[k] = (devMap[k] || 0) + 1; }
  $('tDevice').innerHTML = tableHtml(['기기 · 화면 · 언어', '방문'], Object.entries(devMap).sort((a, b) => b[1] - a[1]).slice(0, 12).map(([k, n]) => [esc(k), n]));
  const hours = new Array(24).fill(0);
  for (const v of visits) hours[new Date(v.created_at).getHours()]++;
  const hmax = Math.max(1, ...hours);
  $('tHour').innerHTML = tableHtml(['시', '방문', ''], hours.map((n, h) => [h + '시', n, `<div class="bar" style="width:120px"><i style="width:${Math.round(100 * n / hmax)}%"></i></div>`]).filter(r => true));

  // ---- 게임 ----
  const tiles = [
    ['방문', visits.length], ['방문자(기기 수)', uniq], ['게임 시작', starts.length], ['죽은 횟수', deaths.length],
    ['평균 버틴 시간', Math.round(avg(deaths.map(d => d.data.time || 0))) + '초'],
    ['평균 처치', avg(deaths.map(d => d.data.kills || 0)).toFixed(1)],
    ['최고 처치', Math.max(0, ...deaths.map(d => d.data.kills || 0))],
    ['최고 먹은 양', Math.max(0, ...deaths.map(d => d.data.maxMass || 0))],
    ['직접 그린 무기로 시작', starts.length ? Math.round(100 * starts.filter(s => s.data.weaponUser).length / starts.length) + '%' : '-'],
  ];
  $('tiles').innerHTML = tiles.map(([l, n]) => `<div class="tile"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('');

  $('fbCount').textContent = `(${fbs.length}개, 전체 기간)`;
  $('fbList').innerHTML = fbs.length ? fbs.map(f => `<div class="fb"><div class="meta">${fmt(f.created_at)} · ${esc(f.nick) || '익명'} · 처치 ${f.data.kills || 0} · 먹은 양 ${f.data.maxMass || 0}
    <button class="danger" data-del="${f.id}">삭제</button></div><div class="msg">${esc(f.data.message)}</div></div>`).join('')
    : '<p class="hint">아직 온 한마디가 없습니다.</p>';
  $('fbList').querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    if (!confirm('이 한마디를 지울까요?')) return;
    const r = await api('/admin/events/' + b.dataset.del, { method: 'DELETE' });
    if (!r.ok) alert('삭제 실패'); else { rows = rows.filter(x => String(x.id) !== b.dataset.del); render(); }
  });

  const byDay = {};
  for (const r of inR) { const k = dayKey(r.created_at); byDay[k] = byDay[k] || { visit: 0, start: 0, death: 0, feedback: 0 }; byDay[k][r.type]++; }
  const dk = Object.keys(byDay).slice(0, 60);
  $('daily').innerHTML = tableHtml(['날짜', '방문', '시작', '죽음', '한마디'], dk.map(k => [k, byDay[k].visit, byDay[k].start, byDay[k].death, byDay[k].feedback]));

  const wmap = {};
  for (const d of deaths) { const k = d.data.weapon || '?'; const w = wmap[k] = wmap[k] || { n: 0, kills: [], time: [], thumb: d.data.weaponThumb, stat: d.data.weaponStat }; w.n++; w.kills.push(d.data.kills || 0); w.time.push(d.data.time || 0); }
  const wl = Object.entries(wmap).sort((a, b) => b[1].n - a[1].n).slice(0, 20), wmax = wl.length ? wl[0][1].n : 1;
  $('weapons').innerHTML = tableHtml(['무기', '판 수', '평균 처치', '평균 버팀', ''], wl.map(([k, w]) => [
    `${w.thumb ? `<img class="w" src="${w.thumb}">` : ''}${esc(k)}<div class="hint">${esc(w.stat || '')}</div>`, w.n, avg(w.kills).toFixed(1), Math.round(avg(w.time)) + '초',
    `<div class="bar" style="width:140px"><i style="width:${Math.round(100 * w.n / wmax)}%"></i></div>`]));

  const kmap = {};
  for (const d of deaths) { const k = d.data.killer || '(알 수 없음)'; kmap[k] = (kmap[k] || 0) + 1; }
  const kl = Object.entries(kmap).sort((a, b) => b[1] - a[1]).slice(0, 15);
  $('killers').innerHTML = tableHtml(['상대', '횟수'], kl.map(([k, n]) => [esc(k), n]));

  $('runs').innerHTML = tableHtml(['시간', '닉네임', '무기', '처치', '먹은 양', '버틴 시간', '구슬(공/속/체/크)', '쓰러뜨린 상대'],
    deaths.slice(0, 100).map(d => [fmt(d.created_at), esc(d.nick) || '익명', `${d.data.weaponThumb ? `<img class="w" src="${d.data.weaponThumb}">` : ''}${esc(d.data.weapon)}`,
      d.data.kills || 0, d.data.maxMass || 0, (d.data.time || 0) + '초',
      d.data.st ? `${d.data.st.atk}/${d.data.st.spd}/${d.data.st.hp}/${d.data.st.size}` : '', esc(d.data.killer)]));
}

api('/admin/me').then(r => { if (r.ok) load(); });
</script>
</body>
</html>
